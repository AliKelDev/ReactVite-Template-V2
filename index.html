<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal / Alikel house style</title>
    <meta name="description" content="Signal: the Alikel house style and React starter. Retro-futurist instruments: night and paper, one violet signal, hairlines and mono labels." />
    <meta name="theme-color" content="#0b0a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before the first paint, so there is no flash.
      (function () {
        var t = "night";
        try {
          var saved = localStorage.getItem("sg-theme");
          if (saved === "night" || saved === "paper") t = saved;
          else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t = "paper";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
